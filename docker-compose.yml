version: "3.8"

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:cached
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=ecoedu
      - DB_PASS=secret
      - DB_NAME=ecoedu_db
    depends_on:
      - db

  db:
    image: mariadb:10.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecoedu_db
      MYSQL_USER: ecoedu
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      # initialize DB from SQL dump on first run (make sure ecoedu_db.sql is at repo root)
      - ./ecoedu_db.sql:/docker-entrypoint-initdb.d/ecoedu_db.sql:ro

volumes:
  db-data: